[package]
name = "globalsearch"
version = "0.6.0"
edition = "2024"
authors = ["Germán Martín Heim <german.martin.heim@gmail.com>"]
license = "MIT"
description = "A multistart framework for global optimization with scatter search and local NLP solvers written in Rust"
readme = "README.md"
repository = "https://github.com/GermanHeim/globalsearch-rs"
keywords = ["optimization", "math", "science"]
categories = ["science", "mathematics"]
exclude = ["/media", ".github", "/python"]
rust-version = "1.87"                                                                                      # MSRV

[dependencies]
ndarray = { version = "0.17" }
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.18"
rand = "0.10.0"
kdam = { version = "0.6.4", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
chrono = { version = "0.4.42", features = ["serde"], optional = true }
basin = { version = "1.13.0", default-features = false }

[features]
default = []
rayon = ["dep:rayon"]
progress_bar = ["dep:kdam"]
checkpointing = ["dep:serde", "dep:bincode", "dep:chrono", "ndarray/serde"]

[dev-dependencies]
criterion = { git = "https://github.com/bheisler/criterion.rs", features = [
    "html_reports",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "six_hump_camel"
harness = false

[[bench]]
name = "scatter_search"
harness = false

[[bench]]
name = "batch_iterations"
harness = false

[[bench]]
name = "parallel_performance"
harness = false

[[example]]
name = "1d-griewank"

[[example]]
name = "3d-ackley"

[[example]]
name = "cross_in_tray"

[[example]]
name = "sixhumpcamel"

[[example]]
name = "checkpointing_example"
required-features = ["checkpointing"]

[[example]]
name = "extended_checkpointing"
required-features = ["checkpointing"]

[[example]]
name = "checkpointing_population_size_expansion"
required-features = ["checkpointing"]
