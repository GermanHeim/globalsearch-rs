name: globalsearch-rs CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features basin"
          - "--features basin"
          - "--features rayon"
          - "--features checkpointing"
          - "--no-default-features --features basin,rayon,checkpointing"
          - "--all-features"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked ${{ matrix.features }}
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.features }} -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build documentation
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Test basin on the minimum supported Rust version
        run: cargo test --locked --no-default-features --features basin,rayon,checkpointing --lib --test basin_solvers
